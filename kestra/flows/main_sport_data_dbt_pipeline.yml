id: dbt_pipeline

namespace: sport_data

description: Exécute les transformations DBT, valide les règles métier puis construit les MARTS.

tasks:

  - id: start
    type: io.kestra.plugin.core.log.Log
    message: "===== Début du workflow : DBT ====="

  - id: dbt_intermediate
    type: io.kestra.plugin.scripts.shell.Commands

    taskRunner:
      type: io.kestra.plugin.core.runner.Process

    commands:
      - |
        cd /workspace/dbt

        echo "===== Construction STAGING + INTERMEDIATE ====="

        dbt run \
          --select "path:models/staging path:models/intermediate" \
          --profiles-dir profiles

    timeout: PT20M

    retry:
      type: constant
      interval: PT30S
      maxAttempt: 2

  - id: business_tests
    type: io.kestra.plugin.scripts.shell.Commands

    taskRunner:
      type: io.kestra.plugin.core.runner.Process

    commands:
      - |
        cd /workspace/dbt

        echo "===== Validation des règles métier ====="

        dbt test \
          --select "path:models/staging path:models/intermediate path:tests/business_rules" \
          --profiles-dir profiles

    timeout: PT20M

    retry:
      type: constant
      interval: PT30S
      maxAttempt: 2

  - id: dbt_marts
    type: io.kestra.plugin.scripts.shell.Commands

    taskRunner:
      type: io.kestra.plugin.core.runner.Process

    commands:
      - |
        cd /workspace/dbt

        echo "===== Construction des MARTS ====="

        dbt run \
          --select "path:models/marts" \
          --profiles-dir profiles

    timeout: PT20M

    retry:
      type: constant
      interval: PT30S
      maxAttempt: 2

  - id: end
    type: io.kestra.plugin.core.log.Log
    message: "===== Workflow DBT terminé avec succès ====="