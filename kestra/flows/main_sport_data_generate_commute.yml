id: generate_commute

namespace: sport_data

description: Génère les distances domicile-travail.

tasks:

  - id: start
    type: io.kestra.plugin.core.log.Log
    message: "===== Début du workflow : Generate Commute ====="

  - id: generate_commute
    type: io.kestra.plugin.scripts.shell.Commands

    taskRunner:
      type: io.kestra.plugin.core.runner.Process

    commands:
      - |
        cd /workspace
        python3 src/generate_commute_distances.py

    timeout: PT20M

    retry:
      type: constant
      interval: PT30S
      maxAttempt: 2

  - id: end
    type: io.kestra.plugin.core.log.Log
    message: "===== Workflow terminé avec succès ====="